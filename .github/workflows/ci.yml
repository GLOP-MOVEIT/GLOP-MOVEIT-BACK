name: CI - GLOP-MOVEIT-BACK
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn clean package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests
        run: mvn test

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Start application
        run: java -jar target/*.jar &
      - name: Wait for app
        run: sleep 15
      - name: Install Bruno CLI
        run: npm install --ignore-scripts -g @usebruno/cli
      - name: Get JWT token
        run: |
          TOKEN=$(curl -sS -X POST "http://localhost:8080/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"nickname":"Julien","password":"password"}' \
            | jq -r '.token // .jwt // .accessToken // .data.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to retrieve JWT token from /auth/login"
            exit 1
          fi

          echo "JWT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run Bruno tests
        run: cd bruno && bru run . --env ci --env-var JWT_TOKEN="$JWT_TOKEN"
