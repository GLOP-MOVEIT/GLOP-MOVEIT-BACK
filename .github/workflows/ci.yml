name: CI - GLOP-MOVEIT-BACK
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
      
      - name: Find JAR location
        run: find . -name "*.jar" -not -path "*/repository/*" 2>/dev/null

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build services
        uses: docker/bake-action@a4d7f0b5b91c14a296d792d4ec53a9db17f02e67
        with:
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start services
        run: docker compose up -d

      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:8080/actuator/health" >/dev/null 2>&1; then
              echo "Gateway is ready"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          echo "Gateway did not become ready in time"
          docker compose logs
          exit 1

      - name: Install Bruno CLI
        run: npm install --ignore-scripts -g @usebruno/cli

      - name: Create test user
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:8080/auth/signup" \
            -H "Content-Type: application/json" \
            -d '{"nickname":"testci","password":"password"}')
          if [[ "$HTTP_CODE" != "2"* && "$HTTP_CODE" != "409" ]]; then
            echo "Register failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Get JWT token
        run: |
          RESPONSE=$(curl -sS -X POST "http://localhost:8080/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"nickname":"testci","password":"password"}')

          TOKEN=$(echo "$RESPONSE" | jq -r '.token // .jwt // .accessToken // .data.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to retrieve JWT token. Response was:"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Run Bruno tests
        run: |
          cd bruno && bru run . \
            --env ci \
            --env-var jwt_token="$JWT_TOKEN" \
            --reporter-junit ../test-results.xml \
            --bail

      - name: Publish test results
        uses: mikepenz/action-junit-report@cf9b6e6a76a5dbb8e7b3a8cf28d8b0b4e2e21d84
        if: always()
        with:
          report_paths: test-results.xml
          fail_on_failure: true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-test-results
          path: test-results.xml

      - name: Stop services
        if: always()
        run: docker compose down -v