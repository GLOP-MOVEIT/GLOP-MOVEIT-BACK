name: CI - GLOP-MOVEIT-BACK
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests
        run: mvn test

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Start services
        run: docker compose up -d --build --quiet-pull > /dev/null 2>&1
      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:8080/actuator/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Gateway did not become ready in time"
          docker compose logs
          exit 1
      - name: Install Bruno CLI
        run: npm install --ignore-scripts -g @usebruno/cli
      - name: Ensure Bruno CI environment
        run: |
          if [ ! -f "bruno/environments/ci.bru" ]; then
            cp bruno/environments/Local.bru bruno/environments/ci.bru
          fi
      - name: Get JWT token
        run: |
          TOKEN=$(curl -sS -X POST "http://localhost:8080/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"nickname":"Julien","password":"password"}' \
            | jq -r '.token // .jwt // .accessToken // .data.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to retrieve JWT token from /auth/login"
            exit 1
          fi

          echo "JWT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run Bruno tests
        run: cd bruno && bru run . --env ci --env-var JWT_TOKEN="$JWT_TOKEN"
      - name: Stop services
        if: always()
        run: docker compose down -v