name: CI - GLOP-MOVEIT-BACK

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn verify

  integration-tests:
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6

      - name: Start services
        run: docker compose up -d --build --quiet-pull

      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:8080/actuator/health" >/dev/null 2>&1; then
              echo "Gateway is ready"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          echo "Gateway did not become ready in time"
          docker compose logs
          exit 1

      - name: Install Bruno CLI
        run: npm install --ignore-scripts -g @usebruno/cli

      - name: Create test user (Bruno)
        run: |
          cd bruno
          bru run Auth-Service/Signup.bru --env ci --bail || true

      - name: Get JWT token (Bruno)
        run: |
          cd bruno
          bru run Auth-Service/Login.bru --env ci --reporter-json login-result.json --bail
          TOKEN=$(jq -r '.[0].results[0].response.data.token' login-result.json)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to retrieve JWT token from Bruno. Response was:"
            cat login-result.json
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "JWT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run Bruno tests
        run: |
          cd bruno
          echo "Listing all .bru files to verify test discovery:"
          find . -name "*.bru"
          bru run  \
            --env ci \
            --env-var JWT_TOKEN=$JWT_TOKEN \
            --exclude-tags auth \
            --reporter-junit ../test-results.xml \
            --bail

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-results.xml
          fail_on_failure: true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-test-results
          path: test-results.xml

      - name: Stop services
        if: always()
        run: docker compose down -v